[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gis-agent-kbh"
version = "0.2.0"
description = "科报会矢量空间分析智能体"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "matplotlib>=3.9", "shapely>=2", "pyproj>=3.6", "keyring>=25"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gis-agent = "gis_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
